name: Sincronizar caixa de eventos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-event-cash
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Ler a planilha pública
        shell: pwsh
        run: ./scripts/sync-event-cash.ps1

      - name: Publicar somente quando os dados mudarem
        shell: bash
        run: |
          if git diff --quiet -- assets/data/eventos.json; then
            echo "A planilha não mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/eventos.json
          git commit -m "Sincroniza caixa de eventos"
          git push
